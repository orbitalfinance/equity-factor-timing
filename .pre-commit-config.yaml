# Pre-commit hooks. Install once with:
#   pip install pre-commit && pre-commit install
# Run on demand with:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=6000"]   # allow the shipped .xlsx / .pkl / notebook, block bigger
      - id: detect-private-key    # block accidental key commits

  # Block secrets (e.g. an Eikon App Key) from ever being committed
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # NOTE: nbstripout is intentionally DISABLED. This notebook is a portfolio
  # artifact whose charts and result tables are meant to stay in git. Enable the
  # block below only if you later prefer output-free notebooks.
  # - repo: https://github.com/kynan/nbstripout
  #   rev: 0.7.1
  #   hooks:
  #     - id: nbstripout

  # Lint + import-sort the Python code
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
